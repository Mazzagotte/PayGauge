// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.1'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Keep generated files out of OneDrive and separate outputs for different checkouts.
def localAppData = System.getenv("LOCALAPPDATA")
def checkoutId = rootProject.projectDir.canonicalPath.digest("SHA-256").take(12)
def buildOutputRoot = localAppData
    ? new File(localAppData, "PayGauge/android-build/${checkoutId}")
    : new File(rootProject.projectDir, "build-tmp")

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    layout.buildDirectory.set(new File(buildOutputRoot, project.path.replace(':', '_')))
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
